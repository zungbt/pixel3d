[workspace]
members = ["meadow", "meadow-core"]
resolver = "3"

# The shipped exe: smaller and a little faster; the panic hook still logs the message.
[profile.release]
lto = true
strip = true

# SPIKE: quick look builds; thin LTO runs on every core. Measurements still use --release.
[profile.quick]
inherits = "release"
lto = "thin"
